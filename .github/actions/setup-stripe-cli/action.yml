name: Set up Stripe CLI
description: Install a pinned Stripe CLI from Stripe's official GitHub release

runs:
  using: composite
  steps:
    - shell: bash
      env:
        STRIPE_CLI_VERSION: 1.45.2
      run: |
        case "$(uname -m)" in
          x86_64) stripe_arch=x86_64 ;;
          aarch64|arm64) stripe_arch=arm64 ;;
          *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac

        stripe_asset="stripe_${STRIPE_CLI_VERSION}_linux_${stripe_arch}.tar.gz"
        stripe_release="https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}"

        curl -fsSLo "/tmp/${stripe_asset}" "${stripe_release}/${stripe_asset}"
        curl -fsSLo /tmp/stripe-linux-checksums.txt "${stripe_release}/stripe-linux-checksums.txt"
        grep " ${stripe_asset}$" /tmp/stripe-linux-checksums.txt | (cd /tmp && sha256sum --check -)
        tar -xzf "/tmp/${stripe_asset}" -C /tmp stripe
        sudo install -m 0755 /tmp/stripe /usr/local/bin/stripe
        test "$(stripe version)" = "stripe version $STRIPE_CLI_VERSION"
        stripe version
