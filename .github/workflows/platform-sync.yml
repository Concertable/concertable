name: Platform sync

# Automates the cross-service publish->consume loop (see plans/PLATFORM_PACKAGE_SYNC.md).
#
# When 'Publish packages' ships new Concertable.* packages to the feed on main, this opens ONE PR
# bumping every service's <ConcertableDotNetPlatformVersion> pin to the just-published version, and turns on
# GitHub auto-merge for THAT PR only (scoped to this bot PR — not a repo-wide setting):
#   - NON-breaking platform change -> the bump PR is green -> the merge queue lands it, no review.
#   - BREAKING platform change     -> the bump PR is red at exactly the consumers that must migrate.
#                                     Auto-merge holds (red never lands). Do the migration IN THIS PR
#                                     (now legal: the new package exists on the feed) and push; it
#                                     lands automatically once CI greens.
#
# Auto-merge only SCHEDULES the merge into the queue — the queue still runs the full pipeline as the
# gate, so a red PR cannot land (this is not the old "skipped check counted as pass" footgun, which
# was a branch-protection required-checks misconfig, not auto-merge). And this will NOT re-trigger off
# its own pin-bump merge (the cascade guard below), so it can't loop.
#
# PREREQUISITE: secret PLATFORM_SYNC_TOKEN — a PAT/App token with contents:write + pull-requests:write.
# Required so the sync PR's push/open triggers test.yml (the default GITHUB_TOKEN can't — recursion guard).

on:
  workflow_run:
    workflows: ["Publish packages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

env:
  # Bellwether package to read the actual latest published version from (all platform packages
  # version lockstep). Sourced from the FEED — never recomputed — so the pin can only ever point at
  # a version that truly shipped (a MinVer recompute once produced phantom versions -> NU1102).
  BELLWETHER: concertable.payment.client
  FEED_DOWNLOAD: https://nuget.pkg.github.com/Concertable/download

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PLATFORM_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.PLATFORM_SYNC_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cascade guard — skip if this publish came from a pin-bump merge
        id: guard
        # A sync PR merge is itself an api/** change, so it re-triggers 'Publish packages'. Without this,
        # that would open another sync PR, ad infinitum. A pin bump changes no package content, so no
        # consumer needs re-syncing — bail out. (Manual workflow_dispatch always proceeds.)
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && git log -1 --format='%B' | grep -qE 'chore/platform-sync-|chore\(platform\): sync'; then
            echo "Triggering commit is a platform-sync pin bump — nothing to sync, stopping to avoid a cascade."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the latest published platform version (from the feed)
        id: ver
        if: steps.guard.outputs.skip == 'false'
        env:
          # The feed's flat-container version index needs packages:read — the default GITHUB_TOKEN has
          # it (PLATFORM_SYNC_TOKEN does not). Basic auth (org + token) matches publish-packages' proven
          # verify-restore nuget.config, so this reads exactly the versions a restore would resolve.
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          idx="$(curl -fsSL -u "Concertable:$FEED_TOKEN" "$FEED_DOWNLOAD/$BELLWETHER/index.json")" \
            || { echo "Could not read $BELLWETHER version index from the feed — refusing"; exit 1; }
          version="$(echo "$idx" | jq -r '.versions[]' | sort -V | tail -1)"
          case "$version" in
            [0-9]*.[0-9]*) : ;;  # sane version string
            *) echo "No usable version parsed from the feed index — refusing"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest published platform version on the feed: $version"

      - name: Bump every lagging service pin
        id: bump
        if: steps.guard.outputs.skip == 'false'
        run: |
          changed="$(bash .github/scripts/bump-platform-version.sh '${{ steps.ver.outputs.version }}')"
          if [ -z "$changed" ]; then
            echo "already-synced=true" >> "$GITHUB_OUTPUT"
            echo "All services already pin ${{ steps.ver.outputs.version }} — nothing to sync."
          else
            echo "already-synced=false" >> "$GITHUB_OUTPUT"
            echo "Bumped:"; echo "$changed"
          fi

      - name: Open the sync PR and enable auto-merge (scoped to this bot PR only)
        if: steps.guard.outputs.skip == 'false' && steps.bump.outputs.already-synced == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/platform-sync-${VERSION}"
          git config user.name  "concertable-platform-sync[bot]"
          git config user.email "platform-sync@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "chore(platform): sync ConcertableDotNetPlatformVersion to ${VERSION}"
          git push --force-with-lease origin "$branch"

          body=$(cat <<EOF
          Automated by \`platform-sync.yml\` after \`Publish packages\` shipped \`${VERSION}\` to the feed.
          Bumps every service's \`<ConcertableDotNetPlatformVersion>\` to \`${VERSION}\`.

          A pin bump is a **package-only** change, so \`test.yml\` gates it on build + unit + integration and
          **no-ops E2E**. Auto-merge is on — the merge queue lands it the moment those are green (its E2E gate
          has nothing to run for a package-only change, so there's no E2E wait):
          - **Green** → non-breaking; merges itself, no review, no E2E.
          - **Red** → a published contract changed shape. Auto-merge holds; migrate the failing consumers
            **in this PR** (now legal — \`${VERSION}\` is on the feed) and push; it lands once CI greens.
          EOF
          )
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "chore(platform): sync to ${VERSION}" --body "$body"
          fi

      - name: Close any superseded platform-sync PRs
        if: steps.guard.outputs.skip == 'false' && steps.bump.outputs.already-synced == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          keep="chore/platform-sync-${VERSION}"
          # Every other open sync PR is an older, now-superseded bump - close it so stale/conflicting ones
          # never accumulate. Preserve only a CLEAN PR whose auto-merge request is actually armed: that is
          # the validated in-flight state which must be allowed to reach the merge queue. CLEAN alone only
          # means mergeable and can also describe a stranded PR whose auto-merge request failed. The older
          # PR's own merge won't re-trigger a sync (the cascade guard above), so nothing is lost by letting
          # a genuinely in-flight one land instead.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/platform-sync-")) | select(.headRefName != "'"$keep"'") | .number' \
          | while read -r n; do
              [ -n "$n" ] || continue
              action="$(gh pr view "$n" --json mergeStateStatus,autoMergeRequest \
                | node .github/scripts/platform-sync-pr-action.mjs)"
              if [ "$action" = "keep" ]; then
                echo "PR #$n is clean with auto-merge armed — leaving it to land."
                continue
              fi
              echo "Closing superseded sync PR #$n"
              gh pr close "$n" --delete-branch \
                --comment "Superseded by the sync to \`${VERSION}\`. Only one platform-sync PR is ever live."
            done

      - name: Enable auto-merge (the merge queue lands it once green)
        if: steps.guard.outputs.skip == 'false' && steps.bump.outputs.already-synced == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/platform-sync-${VERSION}"
          # Enable auto-merge with NO strategy flag. main has a merge queue, so the queue owns the merge method:
          # passing --squash/--merge makes gh reject the whole command ("merge strategy is set by the merge queue"),
          # auto-merge is then never enabled, and the PR sits green-but-unmerged forever (this is why syncs stalled
          # and piled up). A pin bump is package-only, so the queue's E2E gate no-ops and it lands in minutes with no
          # review; a red (breaking) bump just sits for the in-PR migration above.
          #
          # Retry with backoff: a transient GitHub API error here (observed live: a 503 "upstream connect
          # error") previously left an otherwise-green sync PR permanently unmerged with nothing to notice or
          # retry it — the PR just sat there until a human happened to look. Five attempts with growing
          # backoff absorbs a blip; if it's still failing after that, fail the job loudly instead of silently
          # stranding the PR, so the platform-sync-alert.yml / job-failure notification actually fires.
          for attempt in 1 2 3 4 5; do
            if gh pr merge --auto "$branch"; then
              echo "Auto-merge enabled on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt to enable auto-merge failed (possibly a transient GitHub API error) — retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::Failed to enable auto-merge on $branch after 5 attempts. Run 'gh pr merge --auto $branch' by hand."
          exit 1
