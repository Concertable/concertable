name: Publish packages

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      # A publication-policy repair must be able to republish without an unrelated api/** touch.
      - '.github/workflows/publish-packages.yml'
      - '.github/scripts/package_publication_policy.py'
      - '.github/scripts/package_ownership.py'
      - 'eng/repository-split/inventory.py'
      - 'eng/repository-split/inventory.json'
      - 'eng/repository-split/map.yaml'

permissions:
  contents: read
  packages: write

env:
  FEED: https://nuget.pkg.github.com/Concertable/index.json
  FEED_DOWNLOAD: https://nuget.pkg.github.com/Concertable/download

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    # `dotnet pack` restores the whole solution, including Concertable.Auth — which since Phase 2b
    # consumes the shared platform as packages from the feed. Without the feed credential Auth's
    # restore 401s (NU1301) and pack fails. The repo GITHUB_TOKEN reads the org packages this repo
    # published; workflow-level `packages: write` already covers the read.
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from git history + tags

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Pack publishable projects
        run: dotnet pack api/Concertable.slnx --configuration Release --output ${{ runner.temp }}/nupkgs -p:UseLocalPlatformPackages=true

      - name: List packages
        run: ls -l ${{ runner.temp }}/nupkgs

      - name: Keep service-owned packages
        run: >-
          python .github/scripts/package_ownership.py
          eng/repository-split/inventory.json
          filter "${{ runner.temp }}/nupkgs"

      - name: Require a new lockstep package version
        id: version
        run: python .github/scripts/package_publication_policy.py "${{ runner.temp }}/nupkgs"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.nupkg" \
            --source "$FEED" \
            --api-key "${{ secrets.GITHUB_TOKEN }}"

  verify-restore:
    runs-on: ubuntu-latest
    needs: publish
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore the published service closure from the feed (fresh consumer)
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="github" value="$FEED" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="Concertable" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </github>
            </packageSourceCredentials>
          </configuration>
          EOF
          retained=$(python "$GITHUB_WORKSPACE/.github/scripts/package_ownership.py" \
            "$GITHUB_WORKSPACE/eng/repository-split/inventory.json" list retained)
          platform=$(python "$GITHUB_WORKSPACE/.github/scripts/package_ownership.py" \
            "$GITHUB_WORKSPACE/eng/repository-split/inventory.json" list platform-dotnet)
          platform_version=$(sed -nE \
            's:.*<ConcertableDotNetPlatformVersion>([^<]+)</ConcertableDotNetPlatformVersion>.*:\1:p' \
            "$GITHUB_WORKSPACE/api/Concertable.Shared/Directory.Packages.props")
          test -n "$retained" || { echo "No retained packages found — refusing to pass"; exit 1; }
          test -n "$platform" || { echo "No platform packages found — refusing to pass"; exit 1; }
          test -n "$platform_version" || { echo "No platform version found — refusing to pass"; exit 1; }
          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            echo '  <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>'
            echo '  <ItemGroup>'
            echo "$retained" | sed "s#.*#    <PackageReference Include=\"&\" Version=\"$VERSION\" />#"
            echo "$platform" | sed "s#.*#    <PackageReference Include=\"&\" Version=\"$platform_version\" />#"
            echo '  </ItemGroup>'
            echo '</Project>'
          } > consumer.csproj
          dotnet restore
          echo "Restored the retained and platform package closure from GitHub Packages."
