name: Claude PR Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Review this PR for Concertable, a .NET 10 / React platform of independent microservices.
            Your final response will be posted verbatim as a PR comment, so write it as a review.

            The conventions are load-on-demand skills that are NOT vendored into this repo, so on this
            runner you do not have them. Do not review from memory of them and do not restate one here —
            each has exactly one home and a copy in this prompt would drift from it.

            Read, and review against, the docs that ARE in the checkout: repo-root `AGENTS.md`,
            `docs/INDEX.md`, `api/Concertable.B2B/CODE_PATTERNS.md`,
            and any `AGENTS.md` in a directory the diff touches. `.agents/skill-routes.json` maps each
            changed path to the skill that owns its rules: name that skill when a change lands in its
            territory and say the rule could not be checked here, rather than guessing at it.

            Be terse. Flag real issues only — don't nit-pick style or restate what the diff does.
            Group findings as: 🔴 Bugs/regressions, 🟡 Suggestions, 🟣 Pre-existing debt to ignore.
            If there are no real issues, say so in one sentence.
          claude_args: "--model claude-sonnet-4-6 --max-turns 10"
