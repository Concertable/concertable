    # Not the whole .slnx: the AppHost/Hosting composition layer and the E2E harness still reference
    # cross-folder projects (Concertable.AppHost.Shared, Concertable.Testing.E2E, Payment/Search E2E
    # helpers) absent from the carve, and ArchitectureTests reaches them via the AppHost — those wait on
    # the packable-Hosting, AppHost-image-mode and E2E-to-fleet stages. The non-E2E test tier is in. The closure is large, so discover it as "every csproj that is
    # not a test or AppHost project" — every package-clean project is built directly, and a new closure
    # project (or a leaf reached only transitively) is picked up automatically, never orphaned.
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: >-
