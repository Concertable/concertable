  container-images:
    # Gate: every deployable that opts into a container image with <ContainerRepository> must actually
    # produce one. publish-images.yml only runs after merge, so without this a project that cannot be
    # imaged (a missing base image, a Functions app whose host contract is wrong, a Worker that forgot
    # EnableSdkContainerSupport) would break main rather than the PR that broke it.
    #
    # Builds to a local OCI archive instead of pushing: the PR needs to know the image BUILDS, and a PR
    # must never write to the registry. Goes through local-platform.ps1 like every other build job, so a
    # PR that changes platform source images against that source and not the stale feed.
    #
    # The set is derived from <ContainerRepository>, identically to publish-images.yml, so the gate and
    # the publish can never cover different sets. One sequential job rather than a matrix on purpose:
    # the nine publishes share this workspace's obj/, so each reuses what the previous ones compiled,
    # where a matrix would rebuild the shared closure nine times on nine cold runners.
    runs-on: ubuntu-latest
    needs: [local-platform-pack, changes]
    if: needs.changes.outputs.run_code == 'true'
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform
      - name: Build every opted-in deployable as an image
        shell: bash
        run: |
          projects=$(grep -rl '<ContainerRepository>' api --include='*.csproj' | sort)
          test -n "$projects" || { echo "No <ContainerRepository> projects found — refusing to pass"; exit 1; }
          echo "Deployables to image:"
          echo "$projects"
          mkdir -p "$RUNNER_TEMP/images"
          while IFS= read -r project; do
            echo "::group::$project"
            pwsh ./scripts/local-platform.ps1 publish "$project" --configuration Release \
              /t:PublishContainer \
              -p:ContainerImageTag=ci \
              -p:ContainerArchiveOutputPath="$RUNNER_TEMP/images/$(basename "$project" .csproj).tar.gz"
            echo "::endgroup::"
          done <<< "$projects"
          ls -l "$RUNNER_TEMP/images"

  fe-boundaries:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_fe == 'true'
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Test frontend tooling and enforce workspace boundaries
        working-directory: app
        run: npm run test:boundaries && npm run lint:boundaries

  carve-fe:
    # FE analogue of the backend carve-* gates: each surface must restore its shared @concertable tiers
    # PURELY from the npm feed and build standalone. A surface importing a tier it doesn't declare
    # (masked in-monorepo by workspace hoisting) fails at install; a build that only resolves via the
    # monorepo-root workspace fails standalone. scripts/carve-fe.mjs archives the surface, repoints its
    # intra-@concertable deps at the alpha feed tag, restores from the feed only, and builds it (web:
    # vite build; mobile: tsc + expo export).
    # Gated on run_fe so a BE-only PR never pays for the slow feed restores. Same git-archive technique
    # as the backend carves; no fetch-depth needed (archives HEAD).
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_fe == 'true'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        surface: [web/customer, web/admin, web/b2b/venue, web/b2b/artist, web/b2b/business, mobile/customer, mobile/b2b]
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Carve ${{ matrix.surface }} and build it standalone from the feed
        working-directory: app
        run: node scripts/carve-fe.mjs ${{ matrix.surface }}

  unit-tests:
    runs-on: ubuntu-latest
    needs: [build, changes, local-platform-pack]
    if: needs.changes.outputs.run_tests == 'true' && needs.changes.outputs.unit_projects != '[]'
    permissions:
      contents: read
      packages: read

    env:
      # Payment's test graph — and B2B/Customer's via Payment.Client/Contracts — restores feed packages now; 401 without this.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.unit_projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Run ${{ matrix.project }}
        shell: pwsh
        run: ./scripts/local-platform.ps1 test ${{ matrix.project }} --configuration Release

  architecture-tests:
    runs-on: ubuntu-latest
    needs: [build, changes, local-platform-pack]
    if: needs.changes.outputs.run_tests == 'true' && needs.changes.outputs.architecture_projects != '[]'
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.architecture_projects) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform
      - name: Run ${{ matrix.project }}
        shell: pwsh
        run: ./scripts/local-platform.ps1 test ${{ matrix.project }} --configuration Release

  startup-tests:
    runs-on: ubuntu-latest
    needs: [build, changes, local-platform-pack]
    # Gate: would any host refuse to boot on the configuration its app model supplies? Builds every real
    # registration graph and every AppHost resource graph without starting a process, so a configuration or
    # deployment-topology defect fails here in seconds on the PR instead of surfacing as an unrelated E2E
    # timeout in the merge queue. e2e-api-tests needs this job for exactly that reason.
    if: needs.changes.outputs.run_tests == 'true' && needs.changes.outputs.startup_projects != '[]'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.startup_projects) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform
      - name: Run ${{ matrix.project }}
        shell: pwsh
        run: ./scripts/local-platform.ps1 test ${{ matrix.project }} --configuration Release

  integration-tests:
    runs-on: ubuntu-latest
    needs: [build, changes, local-platform-pack, architecture-tests, startup-tests]
    # A cheap gate with an empty matrix skips, and a skipped need would otherwise cascade into skipping
    # this job — silently, which for Concertable.Auth (a service with startup tests and no architecture
    # tests) would mean an Auth-only PR running neither integration nor E2E. Gate on no need having
    # FAILED instead, so ordering still holds but an inapplicable tier does not suppress a later one.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.run_tests == 'true' && needs.changes.outputs.integration_projects != '[]' }}
    permissions:
      contents: read
      packages: read

    env:
      # B2B/Customer integration tests restore Payment.Client/Contracts, now feed packages; 401 without this.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TESTCONTAINERS_RYUK_DISABLED: "true"

    strategy:
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.integration_projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Run ${{ matrix.project }}
        shell: pwsh
        run: ./scripts/local-platform.ps1 test ${{ matrix.project }} --configuration Release

  e2e-api-tests:
    runs-on: ubuntu-latest
    needs: [build, changes, architecture-tests, startup-tests]
    # Runs ONLY in the merge queue — genuinely skipped on the PR and the post-merge push (never a no-op run).
    # E2E is the queue's gate; the PR is gated by build + carve + unit + integration. Safe to skip (not
    # no-op) because ci-complete is the SOLE required check and passes on skipped needs, so a skipped E2E job
    # can't stall queue admission.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'merge_group' && needs.changes.outputs.run_e2e == 'true' }}

    permissions:
      contents: read
      packages: read

    env:
      # Required: dotnet test restores the AppHost + Payment.Client/Contracts, which pull Auth's and
      # Payment's feed packages. Drop this and the merge-queue gate dies at restore (401) before any scenario runs.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      ServiceAuth__B2BClientSecret: ${{ secrets.SERVICE_AUTH_B2B_CLIENT_SECRET }}
      ServiceAuth__CustomerClientSecret: ${{ secrets.SERVICE_AUTH_CUSTOMER_CLIENT_SECRET }}
      ServiceAuth__AuthClientSecret: ${{ secrets.SERVICE_AUTH_AUTH_CLIENT_SECRET }}

    steps:
      - name: Skip API E2E (no runtime change)
        if: needs.changes.outputs.run_e2e != 'true'
        run: echo "No runtime change (non-code or package-only) -> skipping API E2E; build + carve + unit + integration gate this."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_e2e == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_e2e == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_e2e == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.run_e2e == 'true'
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Log in to GHCR
        if: needs.changes.outputs.run_e2e == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision HTTPS dev certificate
        if: needs.changes.outputs.run_e2e == 'true'
        run: |
          dotnet dev-certs https --trust || true  # Linux trust exits 4, but the cert is still generated
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        if: needs.changes.outputs.run_e2e == 'true'
        uses: ./.github/actions/setup-stripe-cli

      - name: Install Azure Functions Core Tools
        if: needs.changes.outputs.run_e2e == 'true'
        # The B2B Workers host is an Azure Functions (v4) app; Aspire launches it via `dotnet run`,
        # which shells out to the `func` Core Tools. Without them the host never binds, so the
        # ConcertFinished* tests get "Connection refused (localhost:7078)" when triggering the timer.
        run: |
          npm install -g azure-functions-core-tools@4.12.1 --unsafe-perm true
          func --version

      - name: Run B2B API E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        shell: pwsh
        run: ./scripts/local-platform.ps1 test api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests/Concertable.B2B.E2ETests.csproj --configuration Release --settings api/Concertable.runsettings

      - name: Run Customer API E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        shell: pwsh
        run: ./scripts/local-platform.ps1 test api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests/Concertable.Customer.E2ETests.csproj --configuration Release --settings api/Concertable.runsettings

      - name: Upload E2E diagnostics
        if: always() && needs.changes.outputs.run_e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-diagnostics
          path: '**/e2e-diagnostics.log'
          if-no-files-found: ignore

  e2e-ui-tests:
    runs-on: ubuntu-latest
    needs: [build, e2e-api-tests, changes]
    # Merge-queue only (see e2e-api-tests): genuinely skipped on the PR, runs the real UI suite in the queue.
    # BLOCKING lane — excludes @quarantine (Category!=quarantine); the flaky scenario runs in the non-gating
    # e2e-ui-quarantine job.
    if: github.event_name == 'merge_group' && needs.changes.outputs.run_e2e_ui == 'true'

    permissions:
      contents: read
      packages: read

    env:
      # Required: building the UI E2E projects restores the AppHost + Payment.Client/Contracts → Auth's and Payment's feed packages (see e2e-api-tests).
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      ServiceAuth__B2BClientSecret: ${{ secrets.SERVICE_AUTH_B2B_CLIENT_SECRET }}
      ServiceAuth__CustomerClientSecret: ${{ secrets.SERVICE_AUTH_CUSTOMER_CLIENT_SECRET }}
      ServiceAuth__AuthClientSecret: ${{ secrets.SERVICE_AUTH_AUTH_CLIENT_SECRET }}

    steps:
      # Gated on run_e2e_ui: off for non-code and package-only changes.
      # Aggregated by ci-complete, which tolerates a skipped need, so it no-ops green when off.
      - name: Skip UI E2E (no runtime change)
        if: needs.changes.outputs.run_e2e_ui != 'true'
        run: echo "UI E2E gated off (non-code / package-only) -> build + carve gate this."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_e2e_ui == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_e2e_ui == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_e2e_ui == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.run_e2e_ui == 'true'
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Log in to GHCR
        if: needs.changes.outputs.run_e2e_ui == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision HTTPS dev certificate
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: |
          dotnet dev-certs https --trust || true  # Linux trust exits 4, but the cert is still generated
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        if: needs.changes.outputs.run_e2e_ui == 'true'
        uses: ./.github/actions/setup-stripe-cli

      - name: Install Azure Functions Core Tools
        if: needs.changes.outputs.run_e2e_ui == 'true'
        # Same as the API E2E job: the full AppHost boots the B2B Workers Azure Functions host,
        # which needs the `func` Core Tools on PATH to launch.
        run: |
          npm install -g azure-functions-core-tools@4.12.1 --unsafe-perm true
          func --version

      - name: Set up Node
        if: needs.changes.outputs.run_e2e_ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web SPA dependencies
        if: needs.changes.outputs.run_e2e_ui == 'true'
        # The UI E2E AppHost serves the venue/artist/business/customer SPAs via `npm run dev` (Vite).
        # They live in the app/ npm workspace; node_modules is gitignored, so without this the dev
        # servers never start and every scenario fails at warm-up with ERR_CONNECTION_REFUSED.
        working-directory: app
        run: npm ci

      - name: Build frontend package dependencies
        if: needs.changes.outputs.run_e2e_ui == 'true'
        # The SPAs consume the shared FE tiers from their built dist (@concertable/web, /b2b,
        # /customer), so all of them must be built before the Vite dev servers start — not just
        # @concertable/shared, or the dev server can't resolve the tier imports and every scenario
        # times out at warm-up.
        working-directory: app
        run: npm run build:web-packages

      - name: Build B2B UI E2E tests
        if: needs.changes.outputs.run_e2e_ui == 'true'
        shell: pwsh
        run: ./scripts/local-platform.ps1 build api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests.Ui/Concertable.B2B.E2ETests.Ui.csproj --configuration Release

      - name: Build Customer UI E2E tests
        if: needs.changes.outputs.run_e2e_ui == 'true'
        shell: pwsh
        run: ./scripts/local-platform.ps1 build api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release

      - name: Install Playwright browsers
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: pwsh api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run B2B UI E2E tests
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: dotnet test api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests.Ui/Concertable.B2B.E2ETests.Ui.csproj --configuration Release --no-build --settings api/Concertable.runsettings --filter "Category!=quarantine"

      - name: Run Customer UI E2E tests
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: dotnet test api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release --no-build --settings api/Concertable.runsettings --filter "Category!=quarantine"

      - name: Upload E2E diagnostics
        # Server logs + Playwright traces/screenshots for diagnosing a UI failure. Failure-only:
        # the trace bundle is large (~hundreds of MB), so don't upload it on green runs.
        if: failure() && needs.changes.outputs.run_e2e_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-diagnostics
          path: |
            **/e2e-diagnostics.log
            **/playwright-traces/**
            **/playwright-failures/**
          if-no-files-found: ignore

  e2e-ui-quarantine:
    # The NON-GATING flake lane. Runs only @quarantine-tagged UI scenarios (Category=quarantine) and is
    # deliberately absent from ci-complete's needs, so a red here reports on the PR but never blocks a
    # merge. Runs on the PR only — a non-gating result in the queue would be wasted stack boot. A
    # quarantined scenario is tracked to be fixed and returned to the blocking lane, not carried forever.
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_e2e_ui == 'true'

    permissions:
      contents: read
      packages: read

    env:
      # No job-level `if` — the job ALWAYS runs and reports success. A skipped check (even a non-required
      # one like this) stalls GitHub's merge-queue admission (the inert-PR N10 stall). RUN gates the real
      # work to a PR that actually has UI changes; otherwise every step no-ops to green.
      RUN: ${{ needs.changes.outputs.run_e2e_ui == 'true' && github.event_name == 'pull_request' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      ServiceAuth__B2BClientSecret: ${{ secrets.SERVICE_AUTH_B2B_CLIENT_SECRET }}
      ServiceAuth__CustomerClientSecret: ${{ secrets.SERVICE_AUTH_CUSTOMER_CLIENT_SECRET }}
      ServiceAuth__AuthClientSecret: ${{ secrets.SERVICE_AUTH_AUTH_CLIENT_SECRET }}

    steps:
      - name: No-op (no UI change, or not a PR run)
        if: env.RUN != 'true'
        run: echo "No @quarantine UI scenarios to run here -> reporting success WITHOUT skipping the check (a skipped check can stall queue admission)."

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - name: Set up .NET
        if: env.RUN == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: env.RUN == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        if: env.RUN == 'true'
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Log in to GHCR
        if: env.RUN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision HTTPS dev certificate
        if: env.RUN == 'true'
        run: |
          dotnet dev-certs https --trust || true  # Linux trust exits 4, but the cert is still generated
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        if: env.RUN == 'true'
        uses: ./.github/actions/setup-stripe-cli

      - name: Install Azure Functions Core Tools
        if: env.RUN == 'true'
        run: |
          npm install -g azure-functions-core-tools@4.12.1 --unsafe-perm true
          func --version

      - name: Set up Node
        if: env.RUN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web SPA dependencies
        if: env.RUN == 'true'
        working-directory: app
        run: npm ci

      - name: Build frontend package dependencies
        if: env.RUN == 'true'
        working-directory: app
        run: npm run build:web-packages

      - name: Build Customer UI E2E tests
        if: env.RUN == 'true'
        shell: pwsh
        run: ./scripts/local-platform.ps1 build api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release

      - name: Install Playwright browsers
        if: env.RUN == 'true'
        run: pwsh api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run quarantined Customer UI E2E scenarios
        if: env.RUN == 'true'
        shell: bash
        # An empty quarantine lane is the healthy steady state, but VSTest exits 1 when a filter matches
        # nothing — so only that specific message is allowed to pass; any other failure still reports.
        run: |
          set -o pipefail
          if dotnet test api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release --no-build --settings api/Concertable.runsettings --filter "Category=quarantine" 2>&1 | tee quarantine-run.log; then
            exit 0
          fi
          grep -q "No test matches the given testcase filter" quarantine-run.log

      - name: Upload quarantine E2E diagnostics
        if: env.RUN == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-quarantine-diagnostics
          path: |
            **/e2e-diagnostics.log
            **/playwright-traces/**
            **/playwright-failures/**
          if-no-files-found: ignore

  hook-tests:
    # The vendored hooks are generated copies of Concertable/agent-standards, and this is the only
    # thing that catches one edited in place or a harness wiring dropped. It never skips: a change
    # anywhere can break it, and the hook set is what enforces the standards on every other change.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Vendored hooks match upstream and this repo's tables give the expected verdicts
        run: python -m unittest discover -s .agents/hooks/tests -t .agents/hooks/tests -v

  workflow-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test repository workflow policy helpers
        run: node --test .github/scripts/*.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the CI service-scope classifier
        run: |
          python -m pip install --quiet pyyaml
          python .github/workflows/tests/test_service_scope.py

  ci-complete:
    # THE SINGLE REQUIRED STATUS CHECK (see plans/platform/PIPELINE_REDESIGN_PLAN.md Phase 1). It aggregates every real
    # CI job into one deterministic pass/fail that is NEVER `skipped`: `if: always()` runs it on every
    # event, and it passes iff nothing it needs failed or was cancelled. Inert jobs skip before allocating
    # runners; this aggregator turns those skipped dependencies into the required success result. needs EVERY gating job directly
    # (build + all carves + unit + integration + both e2e + hook tests) so it reflects the full pipeline.
    runs-on: ubuntu-latest
    needs:
      - build
      - split-inventory
      - local-platform-pack
      - carve-auth
      - carve-payment
      - carve-search
      - carve-b2b
      - carve-customer
      - container-images
      - fe-boundaries
      - carve-fe
      - unit-tests
      - architecture-tests
      - startup-tests
      - integration-tests
      - e2e-api-tests
      - e2e-ui-tests
      - hook-tests
      - workflow-tests
    if: always()
    steps:
      - name: Fail if any CI job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -qE '"result":[[:space:]]*"(failure|cancelled)"'; then
            echo "A CI job failed or was cancelled — blocking the merge."
            exit 1
          fi
          echo "All CI jobs passed (or were legitimately skipped) — ci-complete is green."
