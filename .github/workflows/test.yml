name: CI

on:
  push:
    branches:
      - main
  # No branches filter, deliberately: on pull_request it matches the BASE branch, so `- main` ran no CI
  # at all on a PR stacked on another PR. Every PR is gated whatever it targets; E2E stays merge-queue-only.
  pull_request:
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Classify the diff once so the rest of CI runs only what's relevant, via FIVE gate outputs:
    #   run_code   -> build + carve   (the COMPILE FLOOR: the slnx compiles AND every service builds standalone)
    #   run_tests  -> unit + integration
    #   run_e2e    -> e2e-api-tests
    #   run_e2e_ui -> e2e-ui-tests
    #   run_fe     -> fe-boundaries + carve-fe (the FE COMPILE FLOOR: ownership holds and each surface builds from the feed)
    # Automatic classification, by the changed-file set:
    #   - non-code    (docs / .claude / .agents / .codex / plans / reviews / root dotfiles) -> ALL FOUR
    #                 false: nothing to compile or test. build + carve no-op, unit/integration skip, E2E no-op.
    #   - package-only (nothing but Directory.Packages.props — e.g. platform-sync) -> run_code + run_tests true,
    #                 run_e2e + run_e2e_ui false: a dep bump can break compile/tests so those gate, but it has ZERO
    #                 runtime delta so E2E no-ops.
    #   - anything else -> initially enables every job; this is conservative job plumbing, not E2E-tier policy.
    # The `merge` skill's Step 4 is the single source of truth for the E2E tier: a positive trigger keeps
    # full E2E on via `full-e2e`; no positive trigger selects `skip-e2e`. The hard floor remains build + carve +
    # unit + integration, and every PR still merges through the queue on current main.
    # The same E2E selections can also be supplied as git TRAILERS on their own line — `Skip-E2E: true` or
    # `Skip-E2E-UI: true` — parsed structurally by git (not substring-grepped), so prose that merely mentions a
    # token can't trip it (the pr-227 bug). A PR label of the same name (skip-e2e / skip-e2e-ui) works too.
    #   Skip-E2E-UI / skip-e2e-ui -> run_e2e_ui off       (build+carve, unit+integration, api E2E still run)
    #   Skip-E2E    / skip-e2e    -> run_e2e + run_e2e_ui off  (build+carve, unit+integration still run)
    # NOTE: `ci-complete` is the single required check. Jobs with no work are skipped before runner allocation;
    # `ci-complete` accepts skipped dependencies and reports the required success result.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      run_code:   ${{ steps.detect.outputs.run_code }}
      run_tests:  ${{ steps.detect.outputs.run_tests }}
      run_e2e:    ${{ steps.detect.outputs.run_e2e }}
      run_e2e_ui: ${{ steps.detect.outputs.run_e2e_ui }}
      run_fe:     ${{ steps.detect.outputs.run_fe }}
      unit_projects: ${{ steps.scope.outputs.unit_projects }}
      architecture_projects: ${{ steps.scope.outputs.architecture_projects }}
      startup_projects: ${{ steps.scope.outputs.startup_projects }}
      integration_projects: ${{ steps.scope.outputs.integration_projects }}
      services:             ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover test projects
        id: test-projects
        run: |
          unit_projects=$(find api -type f -name '*.UnitTests.csproj' -print | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          architecture_projects=$(find api -type f -name '*.ArchitectureTests.csproj' -print | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          startup_projects=$(find api -type f -name '*.StartupTests.csproj' -print | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          integration_projects=$(find api -type f -name '*.IntegrationTests.csproj' -print | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          [ "$unit_projects" != '[]' ] || { echo "No unit test projects found."; exit 1; }
          [ "$architecture_projects" != '[]' ] || { echo "No architecture test projects found."; exit 1; }
          [ "$startup_projects" != '[]' ] || { echo "No startup test projects found."; exit 1; }
          [ "$integration_projects" != '[]' ] || { echo "No integration test projects found."; exit 1; }
          echo "all_unit=$unit_projects"                 >> "$GITHUB_OUTPUT"
          echo "all_architecture=$architecture_projects" >> "$GITHUB_OUTPUT"
          echo "all_startup=$startup_projects"           >> "$GITHUB_OUTPUT"
          echo "all_integration=$integration_projects"   >> "$GITHUB_OUTPUT"
      - name: Classify changed files
        id: detect
        run: |
          case "${{ github.event_name }}" in
            merge_group)  base="${{ github.event.merge_group.base_sha }}";  head="${{ github.event.merge_group.head_sha }}";;
            pull_request) base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}";;
            push)         base="${{ github.event.before }}";                head="${{ github.event.after }}";;
            *)            base=""; head="";;
          esac
          echo "event=${{ github.event_name }} base=$base head=$head"
          # No usable range (missing sha, first push with a zero base, unfetched commit) -> fail safe to full CI.
          if [ -z "$base" ] || [ -z "$head" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse -q --verify "$base^{commit}" >/dev/null \
             || ! git rev-parse -q --verify "$head^{commit}" >/dev/null; then
            echo "-> no usable diff range; running full CI."
            echo "run_code=true"   >> "$GITHUB_OUTPUT"
            echo "run_tests=true"  >> "$GITHUB_OUTPUT"
            echo "run_e2e=true"    >> "$GITHUB_OUTPUT"
            echo "run_e2e_ui=true" >> "$GITHUB_OUTPUT"
            echo "run_fe=true"     >> "$GITHUB_OUTPUT"
            echo "services=ALL"    >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" "$head")
          echo "Changed files:"; printf '%s\n' "$files"
          # Inert = cannot affect any build or test: markdown anywhere, and the doc/tooling trees.
          INERT='(\.md$|^\.claude/|^\.agents/|^\.codex/|^docs/|^plans/|^reviews/|^\.gitignore$|^\.gitattributes$|^LICENSE$)'
          PKG='(^|/)Directory\.Packages\.props$'
          run_code=true
          run_tests=true
          run_e2e=true
          run_e2e_ui=true
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$INERT"; then
            run_code=false; run_tests=false; run_e2e=false; run_e2e_ui=false
            echo "-> non-code change; nothing to compile or test (every job no-ops to success)."
          elif [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$PKG"; then
            run_e2e=false; run_e2e_ui=false
            echo "-> package-only bump; build + carve + unit + integration gate, E2E no-ops."
          else
            echo "-> code change; full CI."
          fi
          # run_fe: FE carve gate (the npm analogue of run_code's carve-* jobs). True iff a NON-INERT change
          # touches app/, OR the carve mechanism itself changes (scripts/carve-fe.mjs or this workflow) so a
          # change to the gate re-validates it on its own PR. A BE-only PR never triggers the slow feed-restore
          # FE carves; a docs-only app/ change (app/**/*.md) is inert and also skips.
          if printf '%s\n' "$files" | grep -vE "$INERT" | grep -qE '^app/'; then run_fe=true
          elif printf '%s\n' "$files" | grep -qE '^app/scripts/carve-fe\.mjs$|^\.github/workflows/test\.yml$'; then run_fe=true
          else run_fe=false; fi
          echo "-> run_fe=$run_fe (FE feed-restore carves)."
          # SERVICE SCOPE: which services a change can actually affect, so an unrelated service's
          # suites and standalone carve never gate this PR. Fails safe to ALL: only a diff whose every
          # api/ path sits inside one service folder narrows the scope, and any file outside those
          # folders (shared tiers, api/ root config, the umbrella AppHost, this workflow) means ALL.
          # An empty scope is legitimate — a frontend-only change affects no backend service.
          api_files=$(printf '%s\n' "$files" | grep -E '^api/' || true)
          SERVICE_DIRS='^api/Concertable\.(Auth|B2B|Customer|Payment|Search)([./]|$)'
          if printf '%s\n' "$files" | grep -qE '^\.github/workflows/test\.yml$'; then
            services=ALL
            echo "-> the gate itself changed; every service in scope."
          elif [ -z "$api_files" ]; then
            services=""
            echo "-> no api/ change; no backend service in scope."
          elif printf '%s\n' "$api_files" | grep -qvE "$SERVICE_DIRS"; then
            services=ALL
            echo "-> a shared or api-root path changed; every service in scope."
          else
            services=$(printf '%s\n' "$api_files" \
              | sed -E 's#^api/Concertable\.(Auth|B2B|Customer|Payment|Search).*#\1#' \
              | sort -u | tr '\n' ' ')
            echo "-> service scope: $services"
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          # E2E tier: full-e2e overrides historical opt-outs; otherwise a git trailer or same-named label opts out.
          # Trailers are parsed by git (`--format=%(trailers:...)`), never substring-grepped, so prose that
          # mentions a token can't trigger them. Labels aren't in the merge_group payload, so resolve the PR
          # number (from the event on a PR, from the gh-readonly-queue/<base>/pr-<N>-<sha> ref in the queue).
          prnum=""
          case "${{ github.event_name }}" in
            pull_request) prnum="${{ github.event.pull_request.number }}";;
            merge_group)  prnum="$(printf '%s' '${{ github.event.merge_group.head_ref }}' | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')";;
          esac
          labels=""
          if [ -n "$prnum" ] && ! labels="$(gh pr view "$prnum" --json labels -q '.labels[].name')"; then
            echo "::error::Could not retrieve labels for PR #$prnum; refusing to evaluate E2E opt-outs."
            exit 1
          fi
          echo "E2E tier source: PR #${prnum:-none}, labels: ${labels:-<none>}"
          optout() {  # $1 = trailer key (e.g. Skip-E2E), $2 = label name (e.g. skip-e2e)
            git log --format="%(trailers:key=$1,valueonly=true)" "$base..$head" | grep -qiE '^[[:space:]]*(true|yes|1|on)[[:space:]]*$' && return 0
            printf '%s\n' "$labels" | grep -qixF "$2"
          }
          if printf '%s\n' "$labels" | grep -qixF full-e2e; then
            echo "-> full-e2e override; historical skip labels/trailers ignored."
          else
            if optout Skip-E2E-UI skip-e2e-ui; then
              run_e2e_ui=false
              echo "-> opt-out Skip-E2E-UI; UI E2E off (build + carve + unit + integration + api E2E still run)."
            fi
            if optout Skip-E2E skip-e2e; then
              run_e2e=false; run_e2e_ui=false
              echo "-> opt-out Skip-E2E; all E2E off (build + carve + unit + integration still run)."
            fi
          fi
          # E2E is the MERGE QUEUE's gate only: it runs against live main in the queue and nowhere else.
          # Never pre-gate on the PR (a ~30-min suite shouldn't block PR feedback — build + carve + unit +
          # integration do) nor on the post-merge push. So E2E runs iff this is a merge_group event; the
          # Skip-E2E / Skip-E2E-UI opt-outs above still apply within the queue.
          if [ "${{ github.event_name }}" != "merge_group" ]; then run_e2e=false; run_e2e_ui=false; fi
          echo "run_code=$run_code"     >> "$GITHUB_OUTPUT"
          echo "run_tests=$run_tests"   >> "$GITHUB_OUTPUT"
          echo "run_e2e=$run_e2e"       >> "$GITHUB_OUTPUT"
          echo "run_e2e_ui=$run_e2e_ui" >> "$GITHUB_OUTPUT"
          echo "run_fe=$run_fe"         >> "$GITHUB_OUTPUT"

      - name: Scope test projects to the affected services
        id: scope
        env:
          ALL_UNIT: ${{ steps.test-projects.outputs.all_unit }}
          ALL_ARCHITECTURE: ${{ steps.test-projects.outputs.all_architecture }}
          ALL_STARTUP: ${{ steps.test-projects.outputs.all_startup }}
          ALL_INTEGRATION: ${{ steps.test-projects.outputs.all_integration }}
          SERVICES: ${{ steps.detect.outputs.services }}
        run: |
          # ALL keeps the historical full fan-out. A named scope filters each matrix to the owning
          # service's projects; an empty scope yields empty matrices, so the jobs skip rather than
          # running another service's suites. Shared-tier projects live outside the five service
          # folders and therefore only ever run under ALL, which is exactly when they can be affected.
          if [ "$SERVICES" = "ALL" ]; then
            unit="$ALL_UNIT"; architecture="$ALL_ARCHITECTURE"; startup="$ALL_STARTUP"; integration="$ALL_INTEGRATION"
            echo "-> full fan-out."
          else
            pattern=$(printf '%s' "$SERVICES" | tr ' ' '\n' | grep -v '^$' \
              | sed -E 's|^|^api/Concertable\\.|' | paste -sd '|' -)
            if [ -z "$pattern" ]; then
              unit='[]'; architecture='[]'; startup='[]'; integration='[]'
              echo "-> no service in scope; backend test matrices are empty."
            else
              filter() { printf '%s' "$1" | jq -c --arg p "$pattern" 'map(select(test($p)))'; }
              unit=$(filter "$ALL_UNIT")
              architecture=$(filter "$ALL_ARCHITECTURE")
              startup=$(filter "$ALL_STARTUP")
              integration=$(filter "$ALL_INTEGRATION")
              echo "-> scoped to /$pattern/."
            fi
          fi
          echo "unit=$unit"; echo "architecture=$architecture"; echo "startup=$startup"; echo "integration=$integration"
          echo "unit_projects=$unit"                 >> "$GITHUB_OUTPUT"
          echo "architecture_projects=$architecture" >> "$GITHUB_OUTPUT"
          echo "startup_projects=$startup"           >> "$GITHUB_OUTPUT"
          echo "integration_projects=$integration"   >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: [changes, local-platform-pack]
    if: needs.changes.outputs.run_code == 'true'
    permissions:
      contents: read
      packages: read

    env:
      # Feed credential: the slnx build restores Auth's and Payment's feed packages; the repo token reads the org's own packages.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip build (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to compile; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Build solution
        if: needs.changes.outputs.run_code == 'true'
        shell: pwsh
        run: ./scripts/local-platform.ps1 build api/Concertable.slnx --configuration Release

  split-inventory:
    # Gate: the committed repository-split inventory is current, and no test-tier project declares a
    # cross-repository ProjectReference. The carve jobs catch such an edge only in the service they
    # carve, and only once its whole closure compiles; this catches it repo-wide in seconds, with no
    # build and no feed. Rule + rationale: eng/repository-split/inventory.py.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_code == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python eng/repository-split/inventory.py --check

  local-platform-pack:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOCAL_PLATFORM_VERSION: 0.1.0-local.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Pack the source platform
        shell: pwsh
        run: ./scripts/local-platform.ps1 prepare
      - uses: actions/upload-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform
          if-no-files-found: error

  carve-auth:
    # Gate: Concertable.Auth and its non-E2E test tier must build standalone from their own package
    # closure — a ProjectReference escaping api/Concertable.Auth/ fails here (project-not-found)
    # instead of silently at a repo split. ArchitectureTests is out until the AppHost stages: it
    # reaches the composition layer, which still references cross-folder projects by design.
    # Use `git archive`, not `git subtree split`: the split rewrites the folder's whole history and is
    # far too slow for a gate; archive extracts the tracked tree at HEAD instantly (no fetch-depth: 0).
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: >-
      needs.changes.outputs.run_code == 'true' &&
      (needs.changes.outputs.services == 'ALL' ||
       contains(needs.changes.outputs.services, 'Auth'))
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip carve (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to carve; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Carve api/Concertable.Auth into a standalone tree
        if: needs.changes.outputs.run_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/carve"
          git archive HEAD:api/Concertable.Auth | tar -x -C "$RUNNER_TEMP/carve"
          echo "Carved tree (only api/Concertable.Auth tracked files):"
          ls -la "$RUNNER_TEMP/carve"

      - name: Restore + build the carved Auth from the feed (packages only)
        if: needs.changes.outputs.run_code == 'true'
        working-directory: ${{ runner.temp }}/carve
        run: |
          dotnet new sln --name CarveAuth --format slnx
          dotnet sln CarveAuth.slnx add \
            src/Concertable.Auth/Concertable.Auth.csproj \
            tests/Concertable.Auth.UnitTests/Concertable.Auth.UnitTests.csproj \
            tests/Concertable.Auth.IntegrationTests.Fixtures/Concertable.Auth.IntegrationTests.Fixtures.csproj \
            tests/Concertable.Auth.IntegrationTests/Concertable.Auth.IntegrationTests.csproj
          pwsh "$GITHUB_WORKSPACE/scripts/local-platform.ps1" build "$PWD/CarveAuth.slnx" --configuration Release

  carve-payment:
    # Gate: Concertable.Payment's deployable closure AND its non-E2E test tier must build standalone
    # from their own package closure — a ProjectReference escaping api/Concertable.Payment/ fails here
    # (project-not-found) instead of silently at a repo split. Same `git archive` technique as carve-auth.
    # Not the whole .slnx: the AppHost/Hosting composition layer and the E2E harness still reference
    # cross-folder projects (Concertable.AppHost.Shared, Concertable.Testing.E2E, sibling services'
    # Hosting) that are absent from the carve, and ArchitectureTests reaches them via the AppHost.
    # Those wait on the packable-Hosting, AppHost-image-mode and E2E-to-fleet stages.
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: >-
      needs.changes.outputs.run_code == 'true' &&
      (needs.changes.outputs.services == 'ALL' ||
       contains(needs.changes.outputs.services, 'Payment'))
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip carve (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to carve; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Carve api/Concertable.Payment into a standalone tree
        if: needs.changes.outputs.run_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/carve"
          git archive HEAD:api/Concertable.Payment | tar -x -C "$RUNNER_TEMP/carve"
          echo "Carved tree (only api/Concertable.Payment tracked files):"
          ls -la "$RUNNER_TEMP/carve"

      - name: Restore + build the carved Payment deployable closure from the feed (packages only)
        if: needs.changes.outputs.run_code == 'true'
        working-directory: ${{ runner.temp }}/carve
        # One closure-only solution → a single feed restore, and every package-clean project is built
        # directly, so a future ref-removal can't orphan one from the gate (e.g. Api, reached only via Web).
        # MinVerSkip: the carved tree has no .git, so MinVer can't derive a version — irrelevant for a build-only gate.
        run: |
          dotnet new sln --name CarvePayment --format slnx
          dotnet sln CarvePayment.slnx add \
            src/Concertable.Payment.Web/Concertable.Payment.Web.csproj \
            src/Concertable.Payment.Workers/Concertable.Payment.Workers.csproj \
            src/Concertable.Payment.Client/Concertable.Payment.Client.csproj \
            src/Concertable.Payment.Api/Concertable.Payment.Api.csproj \
            src/Concertable.Payment.Application/Concertable.Payment.Application.csproj \
            src/Concertable.Payment.Infrastructure/Concertable.Payment.Infrastructure.csproj \
            src/Concertable.Payment.Domain/Concertable.Payment.Domain.csproj \
            src/Concertable.Payment.Contracts/Concertable.Payment.Contracts.csproj \
            tests/Concertable.Payment.UnitTests/Concertable.Payment.UnitTests.csproj \
            tests/Concertable.Payment.IntegrationTests/Concertable.Payment.IntegrationTests.csproj \
            tests/Compatibility/Concertable.Payment.PublishedContractFixture/Concertable.Payment.PublishedContractFixture.csproj
          pwsh "$GITHUB_WORKSPACE/scripts/local-platform.ps1" build "$PWD/CarvePayment.slnx" --configuration Release -p:MinVerSkip=true

  carve-search:
    # Gate: Concertable.Search's deployable closure AND its non-E2E test tier must build standalone
    # from their own package closure — a ProjectReference escaping api/Concertable.Search/ fails here
    # (project-not-found) instead of silently at a repo split. Same `git archive` technique as
    # carve-auth/carve-payment. Not the whole .slnx: the AppHost/Hosting composition layer and the E2E
    # harness still reference cross-folder projects (Concertable.AppHost.Shared, Concertable.Testing.E2E)
    # absent from the carve, and ArchitectureTests reaches them via the AppHost — those wait on the
    # packable-Hosting, AppHost-image-mode and E2E-to-fleet stages.
    # Search publishes nothing, so its folder carries no MinVer (no MinVerSkip needed).
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: >-
      needs.changes.outputs.run_code == 'true' &&
      (needs.changes.outputs.services == 'ALL' ||
       contains(needs.changes.outputs.services, 'Search'))
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip carve (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to carve; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Carve api/Concertable.Search into a standalone tree
        if: needs.changes.outputs.run_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/carve"
          git archive HEAD:api/Concertable.Search | tar -x -C "$RUNNER_TEMP/carve"
          echo "Carved tree (only api/Concertable.Search tracked files):"
          ls -la "$RUNNER_TEMP/carve"

      - name: Restore + build the carved Search deployable closure from the feed (packages only)
        if: needs.changes.outputs.run_code == 'true'
        working-directory: ${{ runner.temp }}/carve
        # One closure-only solution → a single feed restore, and every package-clean project is built
        # directly, so a future ref-removal can't orphan one from the gate (e.g. Api, reached only via Web).
        run: |
          dotnet new sln --name CarveSearch --format slnx
          dotnet sln CarveSearch.slnx add \
            src/Concertable.Search.Web/Concertable.Search.Web.csproj \
            src/Concertable.Search.Workers/Concertable.Search.Workers.csproj \
            src/Concertable.Search.Api/Concertable.Search.Api.csproj \
            src/Concertable.Search.Application/Concertable.Search.Application.csproj \
            src/Concertable.Search.Infrastructure/Concertable.Search.Infrastructure.csproj \
            src/Concertable.Search.Domain/Concertable.Search.Domain.csproj \
            src/Seed/Concertable.Search.Seed.Infrastructure/Concertable.Search.Seed.Infrastructure.csproj \
            tests/Concertable.Search.UnitTests/Concertable.Search.UnitTests.csproj \
            tests/Concertable.Search.IntegrationTests.Fixtures/Concertable.Search.IntegrationTests.Fixtures.csproj \
            tests/Concertable.Search.IntegrationTests/Concertable.Search.IntegrationTests.csproj
          pwsh "$GITHUB_WORKSPACE/scripts/local-platform.ps1" build "$PWD/CarveSearch.slnx" --configuration Release

  carve-b2b:
    # Gate: Concertable.B2B's deployable closure must build standalone from its own package closure —
    # a ProjectReference escaping api/Concertable.B2B/ fails here (project-not-found) instead of
    # silently at a repo split. Same `git archive` technique as carve-auth/carve-payment/carve-search.
    # Not the whole .slnx: the AppHost/Hosting composition layer and the E2E harness still reference
    # cross-folder projects (Concertable.AppHost.Shared, Concertable.Testing.E2E, Payment/Search E2E
    # helpers) absent from the carve, and ArchitectureTests reaches them via the AppHost — those wait on
    # the packable-Hosting, AppHost-image-mode and E2E-to-fleet stages. The non-E2E test tier is in. The closure is large (42 projects), so discover it as "every
    # csproj that is not a test or AppHost project" — every package-clean project is built directly, and
    # a new closure project (or a leaf reached only transitively) is picked up automatically, never orphaned.
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: >-
      needs.changes.outputs.run_code == 'true' &&
      (needs.changes.outputs.services == 'ALL' ||
       contains(needs.changes.outputs.services, 'B2B'))
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip carve (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to carve; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: local-platform
          path: artifacts/local-platform

      - name: Carve api/Concertable.B2B into a standalone tree
        if: needs.changes.outputs.run_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/carve"
          git archive HEAD:api/Concertable.B2B | tar -x -C "$RUNNER_TEMP/carve"
          echo "Carved tree (only api/Concertable.B2B tracked files):"
          ls -la "$RUNNER_TEMP/carve"

      - name: Restore + build the carved B2B deployable closure from the feed (packages only)
        if: needs.changes.outputs.run_code == 'true'
        working-directory: ${{ runner.temp }}/carve
        # MinVerSkip: the carved tree has no .git, so MinVer can't derive a version — irrelevant for a build-only gate.
        run: |
          dotnet new sln --name CarveB2B --format slnx
          # Every csproj except E2E, ArchitectureTests and the AppHost/Hosting composition projects,
          # which legitimately reference cross-folder projects absent from the carve. Path/name based, so
          # it can't drift on comment wording and auto-includes new or transitively-only-reached projects.
          mapfile -t PROJS < <(find . -name '*.csproj' \
            -not -path '*E2ETests*' \
            -not -name '*.ArchitectureTests.csproj' \
            -not -path '*/obj/*' \
            -not -name 'Concertable.B2B.AppHost.csproj' \
            -not -name 'Concertable.B2B.Hosting.csproj')
          echo "Package-clean closure projects (${#PROJS[@]}):"
          printf '%s\n' "${PROJS[@]}"
          dotnet sln CarveB2B.slnx add "${PROJS[@]}"
          pwsh "$GITHUB_WORKSPACE/scripts/local-platform.ps1" build "$PWD/CarveB2B.slnx" --configuration Release -p:MinVerSkip=true

  carve-customer:
    # Gate: Concertable.Customer's deployable closure must build standalone from its own package closure —
    # a ProjectReference escaping api/Concertable.Customer/ fails here (project-not-found) instead of
